<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Quality Quiz</title>
  <meta name='impact-site-verification' value='5f27f3f9-19fb-4c4a-b5ea-458a4510cc9b'>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1b2a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #e0eaf4;
    }

    .card {
      background: #111f2e;
      border-radius: 20px;
      box-shadow: 0 8px 48px rgba(0, 0, 0, 0.5);
      padding: 40px 36px;
      max-width: 560px;
      width: 100%;
      animation: fadeIn 0.4s ease;
      border: 1px solid #1e3347;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Progress bar */
    .progress-wrap { margin-bottom: 28px; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #4a7a9b;
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .progress-bar {
      height: 4px;
      background: #1e3347;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    /* Diagnostic label */
    .diag-label {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: #00c6ff;
      background: rgba(0, 198, 255, 0.08);
      border: 1px solid rgba(0, 198, 255, 0.2);
      border-radius: 6px; padding: 4px 10px;
      margin-bottom: 14px;
    }

    /* Question */
    .question-text {
      font-size: 1.2rem; font-weight: 600; color: #e8f4ff;
      line-height: 1.45; margin-bottom: 24px;
    }

    /* Options — large clinical buttons */
    .options { display: flex; flex-direction: column; gap: 12px; }
    .option {
      display: flex; align-items: center; gap: 0;
      border: 1.5px solid #1e3347; border-radius: 14px; cursor: pointer;
      transition: all 0.18s ease; font-size: 0.97rem; color: #b8d4ea;
      background: #162535; user-select: none; overflow: hidden;
      min-height: 64px;
    }
    .option:hover {
      border-color: #00c6ff;
      background: #1a2e42;
      color: #e8f4ff;
    }
    .option.selected {
      border-color: #00c6ff;
      background: linear-gradient(135deg, #0d2a40, #0a1f30);
      color: #ffffff;
    }
    .option-letter {
      width: 52px; min-width: 52px; height: 100%; min-height: 64px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 800; letter-spacing: 0.02em;
      color: #4a7a9b; background: #0d1e2d;
      border-right: 1.5px solid #1e3347;
      transition: all 0.18s ease;
      flex-shrink: 0;
    }
    .option:hover .option-letter { color: #00c6ff; background: #0d2233; }
    .option.selected .option-letter {
      color: #ffffff; background: #00c6ff;
      border-right-color: #00c6ff;
    }
    .option-text {
      padding: 14px 18px; line-height: 1.45; flex: 1;
    }

    /* Next button */
    .btn-next {
      margin-top: 24px; width: 100%; padding: 16px;
      background: linear-gradient(135deg, #0072ff, #005ed4);
      color: #fff; border: none; border-radius: 12px; font-size: 1rem;
      font-weight: 700; cursor: pointer; transition: all 0.2s ease;
      letter-spacing: 0.03em; text-transform: uppercase;
    }
    .btn-next:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }
    .btn-next:not(:disabled):hover {
      background: linear-gradient(135deg, #0080ff, #004fc4);
      transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0, 114, 255, 0.4);
    }

    /* Results screen */
    .results { text-align: center; }
    .results .result-icon {
      font-size: 3.2rem; display: block; margin-bottom: 16px;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.08); }
    }
    .results h2 {
      font-size: 1.4rem; font-weight: 700; color: #e8f4ff; line-height: 1.4; margin-bottom: 14px;
    }
    .results .verdict {
      background: rgba(240, 165, 0, 0.08);
      border-left: 4px solid #f0a500; border-radius: 10px;
      padding: 16px 18px; font-size: 0.97rem; color: #d4b060; line-height: 1.6;
      text-align: left; margin-bottom: 20px;
    }
    .results .verdict strong {
      display: block; margin-bottom: 4px; font-size: 1rem; color: #f0c060;
    }

    /* Biological Why section */
    .bio-why {
      background: rgba(0, 198, 255, 0.05);
      border-radius: 12px; padding: 18px 20px; text-align: left;
      margin-bottom: 20px; border-left: 4px solid #00c6ff;
    }
    .bio-why .section-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: #00c6ff; margin-bottom: 10px;
    }
    .bio-why p { font-size: 0.91rem; color: #8ab8d4; line-height: 1.75; }

    /* 30-Day Protocol section */
    .protocol {
      background: rgba(0, 220, 130, 0.05);
      border-radius: 12px; padding: 18px 20px; text-align: left;
      margin-bottom: 24px; border-left: 4px solid #00dc82;
    }
    .protocol .section-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: #00dc82; margin-bottom: 12px;
    }
    .protocol-list {
      list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px;
    }
    .protocol-list li {
      display: flex; align-items: flex-start; gap: 10px;
      font-size: 0.91rem; color: #8ab8a0; line-height: 1.55;
    }
    .protocol-list li .badge {
      flex-shrink: 0; font-size: 0.65rem; font-weight: 800; letter-spacing: 0.06em;
      padding: 3px 8px; border-radius: 99px; margin-top: 2px;
    }
    .badge-free { background: rgba(0, 220, 130, 0.15); color: #00dc82; border: 1px solid rgba(0,220,130,0.3); }
    .badge-tool { background: rgba(255, 160, 50, 0.15); color: #ffaa32; border: 1px solid rgba(255,160,50,0.3); }
    .protocol-list li .tool-link {
      color: #ffaa32; font-weight: 700; text-decoration: underline; cursor: pointer;
    }

    /* CTA button */
    .btn-cta {
      display: block; width: 100%; padding: 22px 20px;
      background: linear-gradient(135deg, #ff6b2b, #e84400);
      color: #fff; border: none; border-radius: 16px;
      font-size: 1.2rem; font-weight: 800; text-decoration: none;
      cursor: pointer; transition: all 0.2s ease; letter-spacing: 0.01em;
      line-height: 1.3; box-shadow: 0 8px 36px rgba(232, 68, 0, 0.55);
      text-shadow: 0 1px 3px rgba(0,0,0,0.25);
      outline: 3px solid rgba(255,255,255,0.2); outline-offset: -7px;
      margin-bottom: 8px;
    }
    .btn-cta:hover {
      background: linear-gradient(135deg, #ff7d42, #d93d00);
      transform: translateY(-3px);
      box-shadow: 0 16px 44px rgba(232, 68, 0, 0.65);
    }
    .btn-cta span {
      display: block; font-size: 0.77rem; font-weight: 400; opacity: 0.88; margin-top: 5px;
    }

    .retake {
      margin-top: 16px; font-size: 0.82rem; color: #2e5470; cursor: pointer;
      text-decoration: underline; background: none; border: none;
      display: block; margin-left: auto; margin-right: auto;
    }
    .retake:hover { color: #4a7a9b; }

    /* Intro screen */
    .intro { text-align: center; }
    .intro .icon { font-size: 3rem; display: block; margin-bottom: 14px; }
    .intro h1 {
      font-size: 1.6rem; font-weight: 700; color: #e8f4ff; margin-bottom: 12px; line-height: 1.3;
    }
    .intro p {
      font-size: 0.95rem; color: #4a7a9b; line-height: 1.7; margin-bottom: 28px;
    }
    .intro .meta {
      display: flex; justify-content: center; gap: 20px; margin-bottom: 28px; flex-wrap: wrap;
    }
    .intro .meta-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.82rem; color: #2e5470; font-weight: 600;
    }

    @media (max-width: 480px) {
      .card { padding: 24px 16px; }
      .intro h1 { font-size: 1.35rem; }
      .question-text { font-size: 1.05rem; }
      .option { min-height: 58px; font-size: 0.93rem; }
      .option-letter { width: 46px; min-width: 46px; min-height: 58px; font-size: 0.95rem; }
      .btn-cta { font-size: 1.08rem; padding: 20px 14px; }
    }
  </style>
</head>
<body>

<div class="card" id="app"></div>

<script>
  // Options: index 0 = A, 1 = B, 2 = C
  const questions = [
    {
      label: "The Fatigue Filter",
      target: "Mitochondrial Efficiency",
      q: "Describe your energy levels within 60 minutes of waking.",
      options: [
        "Instant clarity, ready to perform.",
        "Slow \"boot-up\" time, require caffeine immediately.",
        "Chronically foggy, feel like I haven't slept."
      ]
    },
    {
      label: "The Melatonin Check",
      target: "Neural Downshift",
      q: "Once in bed, how long does it take you to fall asleep?",
      options: [
        "Under 15 minutes (Optimal).",
        "15–45 minutes (Delayed downshift).",
        "Over 45 minutes, mind racing (Hyper-arousal)."
      ]
    },
    {
      label: "The 3 AM Spike",
      target: "Blood Sugar / Cortisol Stability",
      q: "Do you experience a \"hard wake\" (instantly alert) in the middle of the night?",
      options: [
        "Rarely or never.",
        "Yes, usually between 2:00 AM and 4:00 AM.",
        "Multiple times per night."
      ]
    },
    {
      label: "The Daylight Marker",
      target: "Circadian Alignment",
      q: "When do you view your first source of bright light (sunlight or therapy lamp)?",
      options: [
        "Within 15 minutes of waking.",
        "Within 1 hour of waking.",
        "Usually over 1 hour, or I work in a dark room."
      ]
    },
    {
      label: "The Wearable Data",
      target: "Segmentation / Status",
      q: "Do you track your sleep using a wearable device (Oura, WHOOP, Apple Watch)?",
      options: [
        "Yes, and I review the data daily.",
        "I have one, but don't check it often.",
        "No, I go by how I feel."
      ]
    }
  ];

  const AFFILIATE_LINK = "https://bit.ly/4dBZAfA";

  const results = [
    // Score 0–4: Wired & Tired
    {
      icon: "⚡",
      name: "Wired & Tired",
      tagline: "You're exhausted — but your brain won't switch off.",
      verdict: "Your body is caught in a cortisol-melatonin war every night. The physical discomfort from your pillow is sending constant low-level stress signals to your nervous system, keeping your fight-or-flight response active at exactly the wrong time.",
      bioWhy: "Your adrenal system is producing elevated cortisol well into the evening — and cortisol directly suppresses melatonin production. These two hormones are in biological opposition: you can't wind down while cortisol is elevated. On top of this, poor cervical alignment from your pillow sends micro-pain signals to your brainstem throughout the night, triggering repeated arousal responses that prevent you from entering the deep, restorative sleep stages. The result is a vicious cycle: the more disrupted your sleep, the higher your next-day cortisol — and the harder the next night becomes.",
      protocol: [
        { free: true,  text: "10-minute walk after dinner — lowers evening cortisol by ~25% and accelerates the natural melatonin rise" },
        { free: true,  text: "Blue light block 90 mins before bed — screens suppress melatonin production by up to 50%; dim all screens or use blue light glasses" },
        { free: true,  text: "4-7-8 breathing at lights-out — inhale 4 sec, hold 7 sec, exhale 8 sec; directly activates the parasympathetic nervous system to override the cortisol response" },
        { free: false, text: "Orthopedic contour pillow — eliminates the cervical micro-pain signals keeping your nervous system on high alert all night", link: AFFILIATE_LINK }
      ]
    },
    // Score 5–8: 3 AM Fragmenter
    {
      icon: "🌙",
      name: "3 AM Fragmenter",
      tagline: "You fall asleep fine — but something wakes you in the small hours.",
      verdict: "Your sleep onset is healthy, but your sleep architecture is fracturing mid-cycle. Something — physical, thermal, or hormonal — is pulling you into full wakefulness at the most vulnerable point of the night.",
      bioWhy: "Around the 3–4am mark, your body naturally shifts from deep NREM sleep into a lighter REM sleep phase. This transition is a biological pinch point: the brain briefly reduces its arousal threshold, making you vulnerable to any physical or environmental trigger. Cervical misalignment from an unsupportive pillow creates enough ongoing discomfort to exploit this window — causing a partial arousal that becomes a full wake-up. This triggers a cortisol micro-spike that makes returning to deep sleep nearly impossible, even if you manage to fall back asleep. Over time, this consistently fragments the REM sleep responsible for memory consolidation and emotional regulation.",
      protocol: [
        { free: true,  text: "Set room temperature to 65–68°F (18–20°C) — your core body temperature must drop 1–2°F to stay in deep sleep; a warm room prevents this" },
        { free: true,  text: "No liquids 2 hours before bed — a partial bladder creates low-level physical signals that are enough to trigger waking during the light-sleep transition window" },
        { free: true,  text: "Consistent wake time (even weekends) — anchors your circadian rhythm and deepens the 3–4am sleep stage so minor triggers can't pull you out" },
        { free: false, text: "Contour memory foam pillow — eliminates cervical pressure that exploits the 3am arousal window; the most common physical cause of mid-night waking", link: AFFILIATE_LINK }
      ]
    },
    // Score 9–11: Morning Zombie
    {
      icon: "🧟",
      name: "Morning Zombie",
      tagline: "You're getting the hours — but waking up feeling worse than when you went to bed.",
      verdict: "Duration isn't the problem. Depth is. You're spending time in bed without cycling properly through the restorative stages — particularly slow-wave sleep — where the real overnight repair happens.",
      bioWhy: "Slow-wave sleep (SWS) — also called deep sleep or Stage 3 NREM — is when your body releases 70–80% of its daily human growth hormone, your brain's glymphatic system flushes out neurotoxic waste (including amyloid plaques linked to cognitive decline), and cellular repair peaks. Even low-level cervical tension from poor pillow support sends faint arousal signals to the brainstem throughout the night. You never fully wake, but these micro-arousals repeatedly pull you out of SWS — reducing your total deep sleep time by 30–60 minutes per night without you knowing. The result: 7–8 hours in bed that feel like 5, because the hours aren't spent in the right sleep stages.",
      protocol: [
        { free: true,  text: "Lock in a consistent wake time — the single most powerful lever for increasing slow-wave sleep; irregular wake times shorten deep sleep duration significantly" },
        { free: true,  text: "Magnesium glycinate 300–400mg, 30 mins before bed — one of the best-evidenced sleep supplements; shown in multiple RCTs to increase slow-wave sleep duration" },
        { free: true,  text: "Cold water face splash immediately on waking — triggers a cortisol spike that fully clears sleep inertia within 2 minutes instead of the usual 30–90 minute fog" },
        { free: false, text: "Adjustable orthopedic pillow — correct loft eliminates the overnight micro-arousals that are robbing you of slow-wave sleep; the fix most morning zombies never think to try", link: AFFILIATE_LINK }
      ]
    },
    // Score 12–15: Peak Performer
    {
      icon: "🏆",
      name: "Peak Performer",
      tagline: "Your foundations are solid. Now let's fine-tune for elite-level recovery.",
      verdict: "You're sleeping better than most people — but you're still leaving 15–20% of your restorative potential on the table. At your level, the gains are found in cycle optimization, not basic fixes.",
      bioWhy: "Even high-quality sleepers experience subtle cervical misalignment that costs them 30–45 minutes of deep sleep per night without it registering as a problem. At the Peak Performer level, the biology of sleep becomes a precision sport: slow-wave sleep drives human growth hormone secretion and synaptic pruning; REM sleep drives emotional regulation, pattern recognition, and creative insight. A pillow that's even slightly mismatched to your shoulder width and sleep position creates micro-tension that marginally elevates brainstem arousal thresholds — reducing time in the most valuable sleep stages. The difference between good sleep and elite sleep is often nothing more dramatic than getting the loft and contouring exactly right.",
      protocol: [
        { free: true,  text: "Track your sleep with Sleep Cycle or Pillow app (free tier) — find your personal optimal bedtime by identifying when your sleep score peaks across the week" },
        { free: true,  text: "10 minutes of natural light within 30 mins of waking — the most reliable way to sharpen your circadian anchor, improving deep sleep timing and duration by 15–20%" },
        { free: true,  text: "Evening 'brain dump' — write tomorrow's tasks before bed; reduces pre-sleep cognitive arousal and measurably shortens sleep-onset time in office workers" },
        { free: false, text: "Precision-fit orthopedic pillow — fine-tune cervical support to unlock the final 15–20% of deep and REM sleep you're currently leaving behind", link: AFFILIATE_LINK }
      ]
    }
  ];

  let current = -1;
  let selected = null;
  let answers = [];

  const app = document.getElementById('app');

  function getResult() {
    var q1 = answers[0]; // Fatigue Filter   (A=0, B=1, C=2)
    var q2 = answers[1]; // Melatonin Check  (A=0, B=1, C=2)
    var q3 = answers[2]; // 3 AM Spike       (A=0, B=1, C=2)

    // Priority 1: Q3 = B → 3 AM Fragmenter (specific biological glitch)
    if (q3 === 1) return results[1];

    // Priority 2: Q2 = C (mind racing) → Wired & Tired (highest pain point)
    if (q2 === 2) return results[0];

    // Priority 3: Q2 = A (falls asleep fast) AND Q1 = C (wakes exhausted) → Morning Zombie
    if (q2 === 0 && q1 === 2) return results[2];

    // Priority 4: Default → Peak Performer (mostly A's, no red flags)
    return results[3];
  }

  function render() {
    if (current === -1) return renderIntro();
    if (current >= questions.length) return renderResults();
    renderQuestion();
  }

  function renderIntro() {
    app.innerHTML = `
      <div class="intro">
        <span class="icon">🧬</span>
        <h1>What's Actually Broken In Your Sleep?</h1>
        <p>5 diagnostic questions. One precise biological archetype. A protocol built for your specific sleep failure — not generic advice.</p>
        <div class="meta">
          <div class="meta-item">⬡ 5 diagnostics</div>
          <div class="meta-item">⏱ Under 60 seconds</div>
          <div class="meta-item">🎯 4 possible archetypes</div>
        </div>
        <button class="btn-next" onclick="startQuiz()">Run My Sleep Diagnostic →</button>
      </div>
    `;
  }

  function renderQuestion() {
    var q = questions[current];
    var progress = (current / questions.length) * 100;
    var letters = ['A', 'B', 'C'];

    app.innerHTML = `
      <div class="progress-wrap">
        <div class="progress-label">
          <span>Diagnostic ${current + 1} of ${questions.length}</span>
          <span>${Math.round(progress)}% complete</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: ${progress}%"></div>
        </div>
      </div>
      <div class="diag-label">⬡ ${q.label} &nbsp;·&nbsp; Target: ${q.target}</div>
      <div class="question-text">${q.q}</div>
      <div class="options" id="options">
        ${q.options.map(function(opt, i) {
          return `<div class="option${selected === i ? ' selected' : ''}" onclick="selectOption(${i})">
            <div class="option-letter">${letters[i]}</div>
            <div class="option-text">${opt}</div>
          </div>`;
        }).join('')}
      </div>
      <button class="btn-next" id="nextBtn" ${selected === null ? 'disabled' : ''} onclick="nextQuestion()">
        ${current === questions.length - 1 ? 'Analyse My Sleep →' : 'Next Diagnostic →'}
      </button>
    `;
  }

  function renderResults() {
    var r = getResult();

    var protocolItems = r.protocol.map(function(item) {
      if (item.free) {
        return `<li>
          <span class="badge badge-free">FREE</span>
          <span>${item.text}</span>
        </li>`;
      } else {
        return `<li>
          <span class="badge badge-tool">TOOL</span>
          <span>${item.text} — <a class="tool-link" href="${item.link}" target="_blank" rel="noopener">get it here</a></span>
        </li>`;
      }
    }).join('');

    app.innerHTML = `
      <div class="results">
        <span class="result-icon">${r.icon}</span>
        <h2>You're a: <em>${r.name}</em></h2>
        <div class="verdict">
          <strong>${r.tagline}</strong>
          ${r.verdict}
        </div>

        <div class="bio-why">
          <div class="section-title">🔬 The Biological Why</div>
          <p>${r.bioWhy}</p>
        </div>

        <div class="protocol">
          <div class="section-title">📋 Your 30-Day Protocol</div>
          <ul class="protocol-list">
            ${protocolItems}
          </ul>
        </div>

        <a class="btn-cta" href="${r.protocol[3].link}" target="_blank" rel="noopener">
          Optimise My ${r.name} Now
          <span>Join thousands already sleeping better — free shipping available</span>
        </a>

        <button class="retake" onclick="retake()">Retake the quiz</button>
      </div>
    `;
  }

  function startQuiz() {
    current = 0;
    selected = null;
    answers = [];
    render();
  }

  function selectOption(i) {
    selected = i;
    render();
  }

  function nextQuestion() {
    if (selected === null) return;
    answers.push(selected);
    current++;
    selected = null;
    render();
  }

  function retake() {
    current = -1;
    selected = null;
    answers = [];
    render();
  }

  render();
</script>
</body>
</html>
