<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Quality Quiz</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #e8f4fd 0%, #f0f8ff 50%, #e6f3fb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #2c4a6e;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(100, 160, 220, 0.18);
      padding: 40px 36px;
      max-width: 560px;
      width: 100%;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Progress bar */
    .progress-wrap {
      margin-bottom: 28px;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #7aa8cc;
      margin-bottom: 6px;
      font-weight: 500;
      letter-spacing: 0.03em;
    }
    .progress-bar {
      height: 6px;
      background: #daeef9;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #5ba8d4, #3d8fc0);
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    /* Header */
    .quiz-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .quiz-header .icon {
      font-size: 2.6rem;
      margin-bottom: 10px;
      display: block;
    }
    .quiz-header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      color: #1e3a56;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    .quiz-header p {
      font-size: 0.92rem;
      color: #6a96b8;
      line-height: 1.6;
    }

    /* Question */
    .question-number {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #7aa8cc;
      margin-bottom: 8px;
    }
    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1e3a56;
      line-height: 1.45;
      margin-bottom: 22px;
    }

    /* Options */
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border: 2px solid #d4eaf7;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.95rem;
      color: #2c4a6e;
      background: #f7fbff;
      user-select: none;
    }
    .option:hover {
      border-color: #5ba8d4;
      background: #eaf5fb;
      transform: translateX(3px);
    }
    .option.selected {
      border-color: #3d8fc0;
      background: #daeef9;
      color: #1e3a56;
      font-weight: 600;
    }
    .option-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #9fc8e0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .option.selected .option-dot {
      background: #3d8fc0;
      border-color: #3d8fc0;
    }
    .option.selected .option-dot::after {
      content: '';
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      display: block;
    }

    /* Next button */
    .btn-next {
      margin-top: 26px;
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #5ba8d4, #3478a8);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
    }
    .btn-next:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .btn-next:not(:disabled):hover {
      background: linear-gradient(135deg, #4a97c3, #2a6897);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(61, 143, 192, 0.35);
    }

    /* Results screen */
    .results { text-align: center; }
    .results .result-icon {
      font-size: 3.2rem;
      display: block;
      margin-bottom: 16px;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.08); }
    }
    .results h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1e3a56;
      line-height: 1.4;
      margin-bottom: 14px;
    }
    .results .verdict {
      background: linear-gradient(135deg, #fff3cd, #fff8e6);
      border-left: 4px solid #f0a500;
      border-radius: 10px;
      padding: 16px 18px;
      font-size: 0.97rem;
      color: #5a4010;
      line-height: 1.6;
      text-align: left;
      margin-bottom: 20px;
    }
    .results .verdict strong {
      display: block;
      margin-bottom: 4px;
      font-size: 1rem;
      color: #3d2800;
    }
    .results .tips {
      background: #f0f8ff;
      border-radius: 12px;
      padding: 16px 18px;
      text-align: left;
      margin-bottom: 24px;
      font-size: 0.88rem;
      color: #4a7a9b;
      line-height: 1.7;
    }
    .results .tips ul {
      padding-left: 18px;
    }
    .results .tips ul li {
      margin-bottom: 4px;
    }
    .btn-cta {
      display: block;
      width: 100%;
      padding: 18px 20px;
      background: linear-gradient(135deg, #ff8c42, #f96a00);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1.08rem;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
      line-height: 1.3;
      box-shadow: 0 6px 28px rgba(249, 106, 0, 0.45);
      text-shadow: 0 1px 2px rgba(0,0,0,0.15);
      outline: 3px solid #fff;
      outline-offset: -6px;
    }
    .btn-cta:hover {
      background: linear-gradient(135deg, #ff9f5e, #e85e00);
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(249, 106, 0, 0.55);
    }
    .btn-cta span {
      display: block;
      font-size: 0.75rem;
      font-weight: 400;
      opacity: 0.88;
      margin-top: 3px;
    }
    .retake {
      margin-top: 16px;
      font-size: 0.82rem;
      color: #9fc8e0;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .retake:hover { color: #5ba8d4; }

    /* Intro screen */
    .intro { text-align: center; }
    .intro .icon { font-size: 3rem; display: block; margin-bottom: 14px; }
    .intro h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1e3a56;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .intro p {
      font-size: 0.95rem;
      color: #6a96b8;
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .intro .meta {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .intro .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #7aa8cc;
      font-weight: 500;
    }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      .quiz-header h1, .intro h1 { font-size: 1.35rem; }
      .question-text { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

<div class="card" id="app"></div>

<script>
  const questions = [
    {
      q: "How often do you wake up with neck pain or stiffness?",
      options: [
        "Almost every morning",
        "A few times a week",
        "Occasionally",
        "Rarely or never"
      ]
    },
    {
      q: "What is your primary sleeping position?",
      options: [
        "On my stomach",
        "On my side",
        "On my back",
        "I switch positions constantly"
      ]
    },
    {
      q: "How old is your current pillow?",
      options: [
        "3+ years old",
        "1–3 years old",
        "Less than 1 year",
        "I'm not sure"
      ]
    },
    {
      q: "Do you experience headaches or shoulder tension when you wake up?",
      options: [
        "Yes, regularly",
        "Yes, sometimes",
        "Rarely",
        "No, never"
      ]
    },
    {
      q: "How would you describe your sleep quality overall?",
      options: [
        "Poor — I never feel truly rested",
        "Fair — some nights are better than others",
        "Good — but I know it could be better",
        "Great — I just want to optimise further"
      ]
    }
  ];

  let current = -1; // -1 = intro
  let selected = null;
  let answers = [];

  const app = document.getElementById('app');

  function render() {
    if (current === -1) return renderIntro();
    if (current >= questions.length) return renderResults();
    renderQuestion();
  }

  function renderIntro() {
    app.innerHTML = `
      <div class="intro">
        <span class="icon">🌙</span>
        <h1>Is Your Pillow Secretly Ruining Your Sleep?</h1>
        <p>Take our 60-second Sleep Quality Quiz to find out if your pillow is supporting your neck — or working against it.</p>
        <div class="meta">
          <div class="meta-item">✅ 5 quick questions</div>
          <div class="meta-item">⏱ Under 60 seconds</div>
          <div class="meta-item">🎯 Personalised result</div>
        </div>
        <button class="btn-next" onclick="startQuiz()">Start the Quiz →</button>
      </div>
    `;
  }

  function renderQuestion() {
    const q = questions[current];
    const progress = ((current) / questions.length) * 100;

    app.innerHTML = `
      <div class="progress-wrap">
        <div class="progress-label">
          <span>Question ${current + 1} of ${questions.length}</span>
          <span>${Math.round(progress)}% complete</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: ${progress}%"></div>
        </div>
      </div>
      <div class="question-number">Question ${current + 1}</div>
      <div class="question-text">${q.q}</div>
      <div class="options" id="options">
        ${q.options.map((opt, i) => `
          <div class="option${selected === i ? ' selected' : ''}" onclick="selectOption(${i})">
            <div class="option-dot"></div>
            ${opt}
          </div>
        `).join('')}
      </div>
      <button class="btn-next" id="nextBtn" ${selected === null ? 'disabled' : ''} onclick="nextQuestion()">
        ${current === questions.length - 1 ? 'See My Results →' : 'Next Question →'}
      </button>
    `;
  }

  function renderResults() {
    app.innerHTML = `
      <div class="results">
        <span class="result-icon">😴</span>
        <h2>Your Sleep Quality Assessment</h2>
        <div class="verdict">
          <strong>Your Result: Pillow Misalignment Detected</strong>
          Based on your answers, your current pillow is likely failing your neck alignment — contributing to the pain, stiffness, and broken sleep you're experiencing.
        </div>
        <div class="tips">
          <strong style="color:#2c4a6e; font-size:0.9rem; display:block; margin-bottom:8px;">What this means for you:</strong>
          <ul>
            <li>Your cervical spine isn't being properly supported overnight</li>
            <li>Micro-pain signals may be fragmenting your deep sleep cycles</li>
            <li>Morning stiffness &amp; headaches are a direct result of poor pillow support</li>
            <li>An orthopedic pillow could resolve this in as little as 1–2 weeks</li>
          </ul>
        </div>
        <a class="btn-cta" href="https://bit.ly/4dBZAfA" target="_blank" rel="noopener">
          Get My Recommended Orthopaedic Pillow
          <span>Trusted by thousands — free shipping available</span>
        </a>
        <button class="retake" onclick="retake()">Retake the quiz</button>
      </div>
    `;
  }

  function startQuiz() {
    current = 0;
    selected = null;
    answers = [];
    render();
  }

  function selectOption(i) {
    selected = i;
    render();
  }

  function nextQuestion() {
    if (selected === null) return;
    answers.push(selected);
    current++;
    selected = null;
    render();
  }

  function retake() {
    current = -1;
    selected = null;
    answers = [];
    render();
  }

  render();
</script>
</body>
</html>
